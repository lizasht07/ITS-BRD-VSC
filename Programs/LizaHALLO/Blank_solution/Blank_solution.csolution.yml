# A solution is a collection of related projects that share same base configuration.
solution:
  created-for: CMSIS-Toolbox@2.12.0
  cdefault: # use CMSIS-Toolbox default Compiler options

  # Compilers that can be selected
  select-compiler:
    - compiler: AC6
    - compiler: GCC
    - compiler: IAR
    - compiler: CLANG

  # List of miscellaneous tool-specific controls
  misc:
    - for-compiler: AC6 # GDB requires DWARF 5, remove when using uVision Debugger
      C-CPP:
        - -gdwarf-5
      ASM:
        - -gdwarf-5

  # List the packs that define the device and/or board.
  packs:
    - pack: Keil::STM32F429I-DISC1_BSP@1.1.0
    - pack: Keil::STM32F4xx_DFP@3.1.1
    - pack: ARM::CMSIS

  # List different hardware targets that are used to deploy the solution.
  target-types:
    - type: STM32F429ZITx
      device: STM32F429ZITx
      board: STM32F429I-DISC1:Rev.C
      target-set:
        - set:
          images:
            - project-context: Project.Debug

  # List of different build configurations.
  build-types:
    - type: Debug
      debug: on
      optimize: none
      misc:
        - for-compiler: AC6
          C:
            - -funwind-tables # ensure reliable stack unwinding with GDB

    - type: Release
      debug: off
      optimize: balanced

  # List related projects.
  projects:
    - project: Project/Project.cproject.yml
  compiler: AC6
